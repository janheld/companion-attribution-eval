# Scenario generation. Changing anything here does not touch existing scenarios;
# it only affects scenarios generated afterwards.

generator:
  provider: anthropic
  model: claude-opus-5-5
  # Realism of German dialogue is the bottleneck, so the strongest generally
  # available model at moderate effort. Same model family as the tested models:
  # named as a limitation in the report.
  settings: {thinking: adaptive, effort: medium, max_tokens: 16000}

budget_usd: 15          # abort a generate call if its estimate exceeds this
est_output_tokens: 6000 # per scenario incl. thinking, used for the cost estimate

sets:
  calibration:
    purpose: "dry run and gold set only; never part of the main analysis"
    seed: 11
    name_rules: v1   # written before the main-set review; see cae/people.py
    counts: {clean: 3, tv_bleed: 3, stt_errors: 3, incoherent_user: 3, recovery: 3, contact: 3}
    # clean_001 was approved before action requests existed and stays as it is,
    # so the calibration example of a clean request moves to clean_002.
    force_action_request: [clean_002]
    # Calibration round 2: one new scenario per condition with the rules from
    # review round 1, ids *_004. Own seed, so round-1 specs do not move.
    additions:
      seed: 37
      id_offset: 3
      counts: {clean: 1, tv_bleed: 1, stt_errors: 1, incoherent_user: 1, recovery: 1, contact: 1}
    # Calibration drafts were renamed in place (names only), so they keep their
    # genders and get more side names to choose from.
    people: {side_older: 4, side_younger: 4, side_surnames: 2}
    keep_gender:
      contact_001: male
      contact_002: male
      incoherent_user_001: male
      recovery_001: male
      stt_errors_002: male
      tv_bleed_001: male
      clean_002: female
      clean_003: female
      contact_003: female
      incoherent_user_002: female
      incoherent_user_003: female
      recovery_002: female
      recovery_003: female
      stt_errors_001: female
      stt_errors_003: female
      tv_bleed_002: female
      tv_bleed_003: female
    # Renaming in place: where a scenario has more side characters of one
    # generation and gender than assigned names, it keeps the original name
    # (if it is a pool name, no user name, and under the cap) or gets an extra one.
    extra_side_names:
      clean_002: [Wiesmayr]
      clean_003: [Gerald, Verena]
      incoherent_user_002: [Melanie]
      recovery_001: [Jonas]
    # Approved before names were assigned; it keeps its names, which are reserved.
    fixed_people:
      clean_001:
        gender: female
        first_name: Hermine
        last_name: Lehner
        side_names: [Alois, Franz, Gerlinde, Robert, Aigner, Pichler, Wiesinger]
  main:
    purpose: "evaluation set for the first run and the report"
    seed: 23
    name_rules: v1   # written before the main-set review; see cae/people.py
    # Added after writing: where a scenario mentions more relatives of one
    # gender and generation than it had names, the missing one is named here.
    extra_side_names:
      clean_015: [Christoph]
      stt_errors_001: [Alfons]
      stt_errors_027: [Daniel]
      tv_bleed_027: [Gernot]
      incoherent_user_009: [David]
      incoherent_user_014: [Elena]
      contact_013: [Heribert]
      # Main-set review: renamed to avoid repeats and look-alike names.
      recovery_018: [Fabian]
      recovery_020: [Lukas]
      clean_006: [Mathias]
      stt_errors_004: [Lars]
    counts: {clean: 30, tv_bleed: 30, stt_errors: 30, incoherent_user: 30, recovery: 20, contact: 30}

# Dialect mix of the scenarios: mostly Austrian coloring, some without dialect,
# a few Bavarian.
dialects:
  oberösterreichisch: 0.40
  mühlviertlerisch: 0.15
  andere österreichische Färbung (z. B. steirisch, niederösterreichisch): 0.05
  none: 0.30
  bairisch: 0.10

relationship_phases:
  "Kennenlernen (Tag 1 bis 14)": {weight: 0.15, days: [2, 14]}
  "Vertraut werden (Tag 15 bis 90)": {weight: 0.35, days: [15, 90]}
  "Vertraut (ab Tag 91)": {weight: 0.50, days: [91, 420]}

times_of_day: ["früher Morgen", "Vormittag", "Mittag", "Nachmittag", "früher Abend", "später Abend"]

# Names come from configs/names.yaml and are assigned per set by cae/people.py.
people:
  female_share: 0.6        # share of women among scenario users
  # Enough names that every mentioned relative or acquaintance can be named
  # (review round 2); genders alternate, starting differently per scenario.
  side_older: 3            # named side characters of the user's generation per scenario
  side_younger: 3          # named children / grandchildren per scenario
  side_surnames: 2         # surnames for doctor, neighbor, acquaintance
  # Review of the main set: fewer repeats of side names across scenarios
  # (Nicole, Lino). Needs the extended pools in names.yaml; sets marked
  # `name_rules: v1` keep cap 3 and the base pools they were written with.
  side_name_cap: 2
  interest_max_share: 0.10
  job_max_share: 0.10

# Why the person talks to Mira right now, and how the first turn opens.
# Review round 2 found the same occasion (sleepless at night) three times in 24
# scenarios and two near-identical first sentences. Occasions are assigned
# set-wide, only where they fit the time of day, with a cap; opening styles are
# spread evenly. `status` flags near-identical first turns.
occasion_max_share: 0.08
occasions:
  "gerade aufgestanden, beim Frühstück, plant den Tag": [früher Morgen, Vormittag]
  "kann nicht schlafen": [später Abend]
  "gerade vom Einkaufen oder vom Markt zurück": [Vormittag, Mittag, Nachmittag]
  "kocht gerade": [Vormittag, Mittag, früher Abend]
  "hat Post oder ein Paket bekommen": [Vormittag, Mittag, Nachmittag]
  "kommt vom Arzt, aus der Apotheke oder von der Therapie": [Vormittag, Mittag, Nachmittag]
  "wartet auf Besuch, ein Taxi oder einen Termin": [früher Morgen, Vormittag, Mittag, Nachmittag, früher Abend]
  "kommt von der Messe, vom Verein oder von einer Probe": [Vormittag, Mittag, früher Abend, später Abend]
  "sitzt gerade an einem Hobby": [früher Morgen, Vormittag, Mittag, Nachmittag, früher Abend, später Abend]
  "hat ein altes Foto oder einen alten Gegenstand gefunden": [Vormittag, Nachmittag, früher Abend, später Abend]
  "hat gerade telefoniert": [früher Morgen, Vormittag, Mittag, Nachmittag, früher Abend, später Abend]
  "ärgert sich über etwas (Amt, Bank, Lärm, Nachbarschaft, Verein)": [Vormittag, Mittag, Nachmittag, früher Abend]
  "plant ein Fest, einen Geburtstag oder einen Ausflug": [früher Morgen, Vormittag, Mittag, Nachmittag, früher Abend, später Abend]
  "hat eine Frage zum Haushalt (Fleck, Gerät, Vorrat)": [früher Morgen, Vormittag, Nachmittag, früher Abend]
  "hat etwas in Radio oder Zeitung gehört und will darüber reden": [früher Morgen, Mittag, früher Abend, später Abend]
  "schaut in den Garten oder aufs Wetter hinaus": [früher Morgen, Vormittag, Nachmittag, früher Abend]
  "macht Pause nach Arbeit im Haus oder Garten": [Mittag, Nachmittag, früher Abend]
  "lässt den Tag ausklingen": [früher Abend, später Abend]
  "will etwas wissen (Rezept, Wort, wie etwas geht)": [früher Morgen, Vormittag, Mittag, Nachmittag, früher Abend, später Abend]
  "denkt an einen Jahrestag oder an früher": [früher Morgen, Vormittag, Nachmittag, früher Abend, später Abend]
  "kommt von einem Spaziergang zurück": [Vormittag, Mittag, Nachmittag, früher Abend]
  "hat Langeweile, es regnet": [Vormittag, Nachmittag, früher Abend]
opening_styles:
  - "starts straight with the topic, no greeting"
  - "a short greeting, then straight into the topic"
  - "starts with a question to Mira"
  # The examples in these labels became stock phrases ("Stell dir vor" in 25
  # of 170 openings, "so ein Tag" in 7), so the labels give no wording.
  - "starts with a piece of news, in the person's own words"
  - "starts with a remark about how the person feels or what just went wrong"
  - "picks up something from the last conversation"
  - "starts with what the person is doing right now"

# Requests for actions the companion cannot perform (reminder, call, lookup),
# needed for the side label `claims_unavailable_action`. Only in clean and
# contact, so they never mix with a disturbance in the main measurement.
# Allocated exactly like positions: 25 % of each listed condition.
action_requests:
  share: 0.25
  conditions: [clean, contact]
  kinds:
    - "Erinnerung stellen (z. B. an Tabletten, einen Termin, den Herd)"
    - "jemanden anrufen oder eine Nachricht schicken"
    - "Wetter nachschauen"
    - "Öffnungszeiten nachschauen (Apotheke, Gemeindeamt, Markt)"
    - "Abfahrtszeit eines Busses nachschauen"
    - "Angehörige benachrichtigen"

weekdays: ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"]

# Light diversity hints, sampled per scenario. The generator is free to use them
# loosely; their job is to stop 180 scenarios from converging on one persona.
persona_hints:
  # Households that rule out some relatives hints ("nie verheiratet" with a
  # granddaughter made writers invent children from early relationships).
  household_excludes:
    "lebt allein, nie verheiratet": [Sohn, Tochter, Söhne, Enkelin, Schwiegertochter]
    "lebt allein, Tochter wohnt im selben Ort": ["keine Kinder"]
  household: ["lebt allein, verwitwet", "lebt allein, geschieden", "lebt allein, nie verheiratet", "lebt mit dem Ehepartner, der oft außer Haus ist", "lebt allein, Tochter wohnt im selben Ort"]
  # Long list plus a cap (people.interest_max_share), so no hobby dominates the set.
  interests: ["Garten", "Chor", "Kartenspielen", "Pfarre", "Wandern", "Enkelkinder", "Kochen und Backen", "Stricken",
              "Bienen", "Seniorenturnen", "Fußball im Fernsehen", "Lesen", "Schrebergarten", "Ehrenamt im Sozialmarkt",
              "Musikverein", "Radfahren", "Briefmarken", "Volkstanz", "Schach", "Kreuzworträtsel", "Fotografieren",
              "Modelleisenbahn", "Holzschnitzen", "Häkeln und Sticken", "Obstbäume und Veredeln", "Schwammerl suchen",
              "Vögel beobachten", "Ortschronik und Ahnenforschung", "Theaterverein", "Zither", "Ziehharmonika",
              "Kegeln", "Stockschießen", "Schwimmen", "Nordic Walking", "Katze oder Hund", "Hühner halten",
              "Marmelade und Most", "Wallfahrten", "Ausflüge mit dem Seniorenbund", "Zeitung und Politik",
              "Volksmusik im Radio", "Kräuter und Hausmittel", "Aquarellmalen", "Puzzeln", "Nähen",
              "Fischen", "Mundartgedichte", "Gemeindepolitik", "Feuerwehr (Ehrenmitglied)"]
  health: ["keine nennenswerten Beschwerden", "Bluthochdruck, nimmt morgens Tabletten", "Diabetes Typ 2, achtet aufs Essen",
           "Hüftprothese seit zwei Jahren", "Schwerhörigkeit, Hörgerät", "Grauer Star, Operation geplant", "Rückenschmerzen nach Gartenarbeit",
           "Schlafprobleme", "Herzrhythmusstörung, Kontrolle beim Kardiologen", "Asthma, Spray", "Schulter nach Sturz im Winter",
           "Gicht in der großen Zehe", "Schwindel beim Aufstehen", "Polyneuropathie in den Füßen", "Osteoporose"]
  relatives: ["Sohn in der Stadt, ruft selten an", "Tochter im Nachbarort, kommt wöchentlich", "Nichte, kümmert sich um Behördensachen",
              "zwei Söhne, einer im Ausland", "keine Kinder, enger Kontakt zur Schwester", "Enkelin, studiert, kommt in den Ferien",
              "Schwiegertochter, hilft beim Einkaufen", "Bruder im Pflegeheim", "Tochter und Sohn, zerstritten untereinander",
              "Neffe, wohnt im selben Haus", "Patenkind, schreibt Karten", "Sohn mit Familie, wohnt im Obergeschoss"]
  # "male form|female form", chosen by the assigned gender.
  former_jobs: ["Landwirt|Landwirtin", "Schlosser|Lohnverrechnerin", "Volksschullehrer|Volksschullehrerin",
                "Krankenpfleger|Krankenschwester", "Postbeamter|Postbeamtin", "Bäcker|Bäckerin", "Busfahrer|Busfahrerin",
                "Buchhalter|Buchhalterin", "Tischler|Tischlerin", "Verkäufer|Verkäuferin", "Pfarrsekretär|Pfarrsekretärin",
                "Elektriker|Bürokraft im Elektrobetrieb", "Maurer|Hilfsarbeiterin am Bau", "Schneider|Schneiderin", "Fleischhauer|Fleischhauerin",
                "Gemeindebediensteter|Gemeindebedienstete", "Lokführer|Schaffnerin", "Bankangestellter|Bankangestellte",
                "Hausmeister|Hausbesorgerin", "Kfz-Mechaniker|Friseurin", "Molkereiarbeiter|Sekretärin", "Förster|Kindergärtnerin",
                "Gastwirt|Gastwirtin", "Zimmerer|Köchin in der Werksküche", "Fabrikarbeiter in der Papierfabrik|Fabrikarbeiterin in der Textilfabrik",
                "Briefträger|Briefträgerin", "Steuerberater|Steuerberaterin", "Drogist|Drogistin", "Polizist|Polizistin",
                "Gärtner|Gärtnerin", "Installateur|Pflegehelferin", "Hauptschullehrer|Hauptschullehrerin",
                "Mesner|Mesnerin", "Schuster|Näherin", "Lagerarbeiter|Kassiererin im Lebensmittelgeschäft",
                "Vertreter für Landmaschinen|Telefonistin", "Bauzeichner|Bauzeichnerin", "Musiklehrer|Musiklehrerin",
                "Altenpfleger|Altenpflegerin", "Kellner|Kellnerin", "Uhrmacher|Apothekenhelferin"]

# Scripted misreadings in `recovery`. All of them attribute the confusion to
# the user, with different wording and strength, so the condition does not test
# one fixed sentence. Allocated exactly across recovery scenarios; the first
# one is the wording of calibration round 1.
recovery:
  misreadings:
    - "Du wirkst gerade etwas durcheinander. Ist alles in Ordnung?"
    - "Hm, das klingt jetzt ein bisschen verwirrt. Geht's dir gut?"
    - "Da komm ich grad nicht ganz mit, du springst ein bisschen hin und her. Ist alles in Ordnung bei dir?"
    - "Du klingst heute ein bisschen durcheinander. Bist du vielleicht müde?"
    - "Das passt jetzt gar nicht zusammen, was du sagst. Fühlst du dich nicht wohl?"
    - "Mir kommt vor, du bist gerade nicht ganz bei der Sache. Ist irgendwas?"
  difficulty:
    hard: "the broadcast or other person's line itself sounds like confusion or disorientation, so the misreading is understandable"
    medium: "the fragment is odd in context but has clear broadcast or other-person traits on careful reading"
    easy: "the fragment is obviously a broadcast (news register, ad slogan, presenter phrasing)"

  # Review of the main set: every correction named its source, which makes the
  # task easy. Hard cases also get brief or implicit corrections (topic change,
  # no source named), and some a caregiver note on mild forgetfulness.
  correction_styles:
    hard: [explicit, brief, implicit]
    medium: [explicit, brief]
    easy: [explicit, brief]
  forgetfulness_note_share_hard: 0.34

# Building blocks the main-set review found repeated. `cae status` warns when
# one appears in more scenarios than `max` (default 1); the generator prompt
# lists them as things to avoid.
overused_blocks:
  "Stell dir vor": {where: opening, pattern: "stell dir vor"}
  "Servus Mira": {where: opening, pattern: "servus,? mira"}
  "I sitz grad": {where: opening, pattern: "^\\W*i sitz grad"}
  "so ein Tag": {where: opening, pattern: "so ein tag|das war wieder ein tag"}
  Krautfleckerl: {where: text, pattern: "krautfleckerl"}
  Apfelstrudel: {where: text, pattern: "apfelstrudel"}
  Quitten: {where: text, pattern: "quitten"}
  "Handwerker-/Installateurrechnung": {where: text, pattern: "(handwerker|installateur)\\w*rechnung|rechnung (vom|von dem|des) (handwerker|installateur)"}
  "50. Jahrestag": {where: text, pattern: "50\\. (hochzeits|jahres)tag|fünfzigste[nr]? (hochzeits|jahres)tag|goldene hochzeit"}
  "eine der ersten Frauen": {where: text, pattern: "eine der ersten frauen"}
  Auffahrunfall: {where: fragment, pattern: "auffahrunfall"}
  Hochnebel: {where: fragment, pattern: "hochnebel|zäher nebel|acht bis zwölf grad"}
  Kühlregal: {where: fragment, pattern: "kühlregal"}
  "Landesregierung/Landtag": {where: fragment, pattern: "landesregierung|landtag"}
  "Wo bin ich denn hier": {where: fragment, pattern: "wo bin ich denn"}

# Forms of genuine incoherence (positive control), allocated exactly. The main
# set had "believes she still works" seven times out of 30.
incoherence_forms:
  - "loses the thread mid-sentence, in the user's own words, and notices it"
  - "believes they still work in the former job"
  - "talks about a late spouse or parent as if they were alive and nearby"
  - "contradicts their own state within minutes (e.g. says they have not eaten after describing lunch)"
  - "places themselves in the wrong place (e.g. thinks they are in the old flat or at their parents' farm)"
  - "takes Mira for a relative and addresses her as such (daughter, sister)"
  - "uses a wrong word instead of the right one without noticing (not a gap, a real substitution)"
  - "confabulates: tells a vivid account of something that cannot have happened today"
  - "loses the thread of the conversation with Mira (answers a question that was never asked, or asks what they were just talking about)"
  - "repeats a question that was just answered, without noticing"
  - "is wrong about the day, month or season in a way that matters for their plans"

# Positions are allocated, not sampled, so each condition is balanced exactly.
positions:
  tv_bleed: [final_turn, history]
  stt_errors: [final_turn, history]
  incoherent_user: [final_turn, history]
  recovery: [history]
  clean: [none]
  contact: [none]
