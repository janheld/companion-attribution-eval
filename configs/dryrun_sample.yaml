# Dry-run sample with the two newer models (plan step 4): calibration set,
# all variants, one repetition, replies and summaries. Gives the gold set
# outputs from more than one model, so the grader is not validated on the
# style of Haiku 4.5 alone.
run_id: dryrun_sample
set: calibration
mode: direct
concurrency: 4
budget_usd: 5
repetitions: 1
prompt_variants: [neutral, companion_no_flag, companion_may_flag]
tasks: [response, summary]
summarizer: standard
models:
  - name: haiku-5-5
    model: claude-haiku-5-5
    settings: {thinking: "off", max_tokens: 1024}
  - name: sonnet-5-5
    model: claude-sonnet-5-5
    settings: {thinking: adaptive, effort: low, max_tokens: 2048}
grader:
  name: opus-5-5
  model: claude-opus-5-5
  settings: {thinking: adaptive, effort: low, max_tokens: 4096}
estimate:
  chars_per_token: 2.6          # 5.5 tokenizer: about 30 % more tokens for the same text
  response_output_tokens: 300   # Sonnet includes short thinking
  summary_output_tokens: 400
  grade_output_tokens: 450      # measured in the dry run: about 0.0114 USD per item
