# Name pools for scenario people, typical for Austria and Bavaria.
#
# Why fixed pools: independently written scenarios converge on the same few
# names (Hermine, Alois, Sabine ...), which makes the set look staged and lets
# personas blur into each other. Names are therefore assigned per set, not left
# to the writer:
#   - every user first name and surname occurs at most once per set,
#   - side characters (relatives, neighbors, friends) get names from these
#     pools too, never a user name of the same set, at most 3 times per set.
# Names that are also ordinary German words or holidays (August, Ernst, Roman,
# Nikolaus, Fuchs, Rauch, Pilz ...) are left out so the automatic name check
# does not misfire.

